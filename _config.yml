# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: QUAIL
author: QUAIL
email: simon.caton@ucd.com
description: > # this means to ignore newlines until "baseurl:"
  QUantum Algorithmic Intelligence Laboratory, University College Dublin. Our research group is focused on the development of quantum algorithms and their applications to real-world problems. We are particularly interested in the intersection of quantum computing, machine learning, and optimization.
baseurl: ""
url: "http://ucd-quail.github.io"

google_analytics: G-J5RKRW6JJ3

include:
  - _pages

sass_dir: ./_sass

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true # default for kramdown is false. This will enable using Markdown links

